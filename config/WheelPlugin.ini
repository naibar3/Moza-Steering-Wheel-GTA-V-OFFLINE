; WheelPlugin settings. Everything here can be changed in the in-game menu (F11), which also writes this file.
; Lines starting with ; are comments. 1 = on, 0 = off.

[Devices]
; Wheel base with force feedback: auto = first FFB device (Moza preferred), or part of the device name
Wheel=auto
; empty = pedals are on the wheel base
Pedals=
; empty = handbrake is on the pedals / base
Handbrake=
; external H-shifter (a part of its name, e.g. Arduino); empty = none
Shifter=

[Axes]
; axes are bound in the menu (Steering and pedals). X Y Z RX RY RZ S0 S1
Steer=X
InvertSteer=0
Throttle=Y
InvertThrottle=1
Brake=RZ
InvertBrake=1
Clutch=
InvertClutch=1
Handbrake=
InvertHandbrake=0
; WheelRange = rotation set in your wheel software (degrees). SteerLock = wheel rotation for full lock in the game
WheelRange=900.00
SteerLock=900.00
Deadzone=0.02
NonLinearity=0.00
DirectSteering=1
; the game ignores about the first quarter of an analog control: lift small inputs above it
DeadZoneComp=0.25
PedalDeadZoneComp=0.25

[Shifter]
Enabled=1
; Auto, Manual (H-pattern + clutch) or Sequential (paddles)
Mode=Auto
; button numbers, -1 = not bound (bind them in the menu)
Gear1=0
Gear2=1
Gear3=2
Gear4=3
Gear5=4
Gear6=5
Gear7=-1
Gear8=-1
Gear9=-1
Gear10=-1
GearR=6
PaddleUp=-1
PaddleDown=-1
HandbrakeButton=-1
ToggleButton=-1
; wheel button that starts / stops the engine (same as the engine key)
StartButton=-1
MarkButton=-1
StallSpeed=1.70

[Clutch]
CreepKmh=2.50
GearSpacing=2.00
StallSensitivity=1.00
CrankTime=0.70

[FFB]
Version=2
Enabled=1
Invert=0
Gain=1.00
Weight=0.30
Damping=0.20
Lateral=1.00
CenteringLow=0.00
CenteringHigh=0.00
EngineResonance=0.10
Terrain=0.15
Bumps=0.50
Collisions=0.60
GearboxGrind=0.50
Understeer=0.30
HardwareConditions=0
; HwSign / HwSignKnown are written by the automatic force direction test on the first start

[Keys]
; virtual-key codes (122 = F11, 121 = F10, 119 = F8, 74 = J), 0 = unused
Menu=122
Transmission=121
; engine: tap while it runs = off, hold while it is off = start
EngineStart=119
SaveCapture=0
DumpAxes=0
; hold next to a gas pump to refuel
Refuel=74

[Sim]
; every part can be switched off (0): a part that is off does not run at all
Fuel=1
; km a full tank lasts at moderate use (the map is small: a real range would never run dry)
FuelRangeKm=80
; tank level (0..1) of a vehicle the first time it is driven
StartFuel=0.65
; tank fraction per second while refuelling
RefuelRate=0.04
; the engine key also switches a running engine off
EngineKey=1
; refuelling costs story-mode cash (shown as baht); 0 = free
FuelPay=1
FuelPriceBaht=40
TankLiters=60
; wheel button to hold for refuelling, -1 = none
RefuelButton=-1
; map icons and 3D markers at gas pumps found while driving (remembered in WheelPlugin_pumps.txt)
FuelBlips=1
FuelMarkers=1
; HUD
NeonHud=1
HudScale=1.00
Speedometer=1
FuelGauge=1
Mph=0
; Thai text (embedded TH Sarabun font); ThaiSize 1.00 = 100%
Thai=1
ThaiSize=1.00
ThaiBold=1

[Block]
; switch off the game's own function of these keys (1 = blocked). Off by default.
; F1 / F2 = Rockstar Editor recording, F3 = save replay clip, F5-F8 = character switch (F8 = go online)
F1=0
F2=0
F3=0
F5toF8=0
